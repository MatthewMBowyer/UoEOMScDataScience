# Daily reminder email for the owner's personal pages (sports + good_hubby).
#
# The site is static, so it cannot send email itself. GitHub Actions can, for
# free, and that is the whole reason this workflow exists: the owner asked for
# reminders to arrive rather than to be looked up.
#
# It emails whatever `scripts/personal_digest.py` prints. Nothing else is needed.
#
# SETUP (one time, by the owner):
#   1. Use a mail account that allows SMTP with an app password. Gmail needs an
#      "App password" (Google Account -> Security -> 2-Step Verification -> App
#      passwords); a normal password will not work.
#   2. Repository -> Settings -> Secrets and variables -> Actions -> New secret:
#        MAIL_USERNAME  = the sending address, e.g. you@gmail.com
#        MAIL_PASSWORD  = the app password
#        MAIL_TO        = where to send it (may be the same address)
#   3. That is it. It runs daily at 05:00 SAST, and can also be triggered by hand
#      from the Actions tab ("Run workflow").
#
# Without those secrets the job still runs and prints the digest into the run
# log, so it degrades to "read the log" rather than failing silently.

name: personal-digest

on:
  schedule:
    # 03:00 UTC = 05:00 SAST, daily. GitHub's scheduler is best-effort; a delay
    # of a few minutes, occasionally more, is normal.
    - cron: "0 3 * * *"
    # 05:00 UTC = 07:00 SAST on Sundays. Same job, wider news window and a
    # 14-day look-ahead, so the weekly one is a summary rather than a repeat.
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to include"
        required: false
        default: "10"
      weekly:
        description: "Widen the news window and look 14 days ahead"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    # Guarded so the Sunday cron does not also fire the daily job, and so a
    # manual weekly run sends one email rather than two.
    if: github.event.schedule != '0 5 * * 0' && !inputs.weekly
    runs-on: ubuntu-latest
    # Research makes a handful of HTTP calls. Measured at ~18s locally, so 5
    # minutes is generous headroom; the cap stops a hung source from burning
    # the job's time budget. Inside the script, total_budget_seconds is the
    # tighter bound.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the digest
        env:
          DAYS: ${{ inputs.days || '10' }}
          WEEKLY: ${{ inputs.weekly && '--weekly' || '' }}
        run: |
          python3 scripts/personal_digest.py --days "$DAYS" $WEEKLY > digest.txt
          python3 scripts/personal_digest.py --days "$DAYS" --subject > subject.txt
          echo "--- digest ---"
          cat digest.txt

      - name: Email it
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # The HTML part is rendered by the sender, so it needs the same window
          # as digest.txt above; otherwise the two parts of one email disagree.
          DAYS: ${{ inputs.days || '10' }}
          WEEKLY: ${{ inputs.weekly && '--weekly' || '' }}
        run: python3 scripts/send_digest_email.py

  weekly:
    # Sunday cron only, or an explicit manual run with weekly=true.
    if: github.event.schedule == '0 5 * * 0' || inputs.weekly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the weekly digest
        run: |
          python3 scripts/personal_digest.py --days 14 --weekly > digest.txt
          python3 scripts/personal_digest.py --days 14 --subject > subject.txt
          echo "--- digest ---"
          cat digest.txt

      - name: Email it
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Must match the 14-day window used for digest.txt in this job.
          DAYS: "14"
          WEEKLY: "--weekly"
        run: python3 scripts/send_digest_email.py
