# Daily reminder email for the owner's personal pages (sports + good_hubby).
#
# The site is static, so it cannot send email itself. GitHub Actions can, for
# free, and that is the whole reason this workflow exists: the owner asked for
# reminders to arrive rather than to be looked up.
#
# It emails whatever `scripts/personal_digest.py` prints. Nothing else is needed.
#
# SETUP (one time, by the owner):
#   1. Use a mail account that allows SMTP with an app password. Gmail needs an
#      "App password" (Google Account -> Security -> 2-Step Verification -> App
#      passwords); a normal password will not work.
#   2. Repository -> Settings -> Secrets and variables -> Actions -> New secret:
#        MAIL_USERNAME  = the sending address, e.g. you@gmail.com
#        MAIL_PASSWORD  = the app password
#        MAIL_TO        = where to send it (may be the same address)
#   3. That is it. It runs daily at 05:00 SAST, and can also be triggered by hand
#      from the Actions tab ("Run workflow").
#
# Without those secrets the job still runs, but it deliberately does NOT print
# the digest: this repository is public and Actions logs are world-readable, and
# the digest carries the private good_hubby reminders. The run reports a line
# count instead. To read the digest without the email, run RUN_DIGEST_NOW.bat on
# your own PC.

name: personal-digest

on:
  schedule:
    # 03:00 UTC = 05:00 SAST, daily. GitHub's scheduler is best-effort and, in
    # practice on this repository, runs land 6-7 hours late (around midday
    # SAST) rather than minutes late. Treat the time as "sometime in the
    # morning", not an alarm clock.
    - cron: "0 3 * * *"
    # 05:00 UTC = 07:00 SAST on Sundays. Same job, wider news window and a
    # 14-day look-ahead, so the weekly one is a summary rather than a repeat.
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to include"
        required: false
        default: "10"
      weekly:
        description: "Widen the news window and look 14 days ahead"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    # Guarded so the Sunday cron does not also fire the daily job, and so a
    # manual weekly run sends one email rather than two.
    if: github.event.schedule != '0 5 * * 0' && !inputs.weekly
    runs-on: ubuntu-latest
    # Research makes a handful of HTTP calls. Measured at ~16s locally, so 5
    # minutes is generous headroom; the cap stops a hung source from burning
    # the job's time budget. Inside the script, total_budget_seconds is the
    # tighter bound.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the digest
        env:
          DAYS: ${{ inputs.days || '10' }}
          WEEKLY: ${{ inputs.weekly && '--weekly' || '' }}
        run: |
          # One pass writes all three parts from a single research gather, so
          # the text and HTML bodies are the same digest and the feeds are
          # fetched once (~16s rather than ~32s).
          python3 scripts/personal_digest.py --days "$DAYS" $WEEKLY --out-dir .
          # This repository is PUBLIC and Actions logs are readable by anyone, so
          # the digest body must never be echoed here: it carries the private
          # good_hubby reminders. Print shape only, enough to debug a failure.
          echo "--- digest summary ---"
          echo "lines: $(wc -l < digest.txt), bytes: $(wc -c < digest.txt)"

      # A cheap connectivity probe: it turns "the email never arrived" into a
      # clear DNS/TLS answer in the run log, without touching the mail account.
      - name: Test Gmail SMTP connection
        run: |
          python3 - <<'PY'
          import socket
          import ssl

          host = "smtp.gmail.com"

          for port in (465, 587):
              print(f"\nTesting {host}:{port}", flush=True)

              try:
                  with socket.create_connection((host, port), timeout=10) as sock:
                      print(f"Port {port}: TCP connected", flush=True)

                      if port == 465:
                          context = ssl.create_default_context()

                          with context.wrap_socket(
                              sock, server_hostname=host
                          ) as tls:
                              print(f"Port {port}: TLS successful", flush=True)

              except Exception as exc:
                  print(f"Port {port}: {type(exc).__name__}: {exc}", flush=True)

          PY

      - name: Email it
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # digest.html is already rendered above; these are the fallback window
          # if that file is ever missing.
          DAYS: ${{ inputs.days || '10' }}
          WEEKLY: ${{ inputs.weekly && '--weekly' || '' }}
        run: python3 scripts/send_digest_email.py

  weekly:
    # Sunday cron only, or an explicit manual run with weekly=true.
    if: github.event.schedule == '0 5 * * 0' || inputs.weekly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the weekly digest
        run: |
          # One pass, single research gather; see the daily job above.
          python3 scripts/personal_digest.py --days 14 --weekly --out-dir .
          # Public repo, world-readable logs: shape only, never the body.
          echo "--- digest summary ---"
          echo "lines: $(wc -l < digest.txt), bytes: $(wc -c < digest.txt)"

      - name: Email it
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Must match the 14-day window used for digest.txt in this job.
          DAYS: "14"
          WEEKLY: "--weekly"
        run: python3 scripts/send_digest_email.py
