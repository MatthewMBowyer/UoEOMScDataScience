
# Daily personal digest email
# Runs daily at 05:00 South African time.
# Can also be triggered manually from GitHub Actions.

name: personal-digest

on:
  schedule:
    # 03:00 UTC = 05:00 SAST
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to include"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Generate the digest
      - name: Build the digest
        env:
          DAYS: ${{ inputs.days || '10' }}
        run: |
          python3 scripts/personal_digest.py --days "$DAYS" > digest.txt
          python3 scripts/personal_digest.py --days "$DAYS" --subject > subject.txt

          echo "--- digest ---"
          cat digest.txt

      # Step 4: Test Gmail SMTP connectivity
      - name: Test Gmail SMTP connection
        run: |
          python3 - <<'PY'
          import socket
          import ssl

          host = "smtp.gmail.com"

          for port in (465, 587):
              print(f"\nTesting {host}:{port}", flush=True)

              try:
                  with socket.create_connection(
                      (host, port), timeout=10
                  ) as sock:
                      print(f"Port {port}: TCP connected", flush=True)

                      if port == 465:
                          context = ssl.create_default_context()

                          with context.wrap_socket(
                              sock,
                              server_hostname=host
                          ) as tls:
                              print(
                                  f"Port {port}: TLS successful",
                                  flush=True
                              )

              except Exception as exc:
                  print(
                      f"Port {port}: "
                      f"{type(exc).__name__}: {exc}",
                      flush=True
                  )

          PY

      # Step 5: Send the email
      - name: Email it
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 scripts/send_digest_email.py
